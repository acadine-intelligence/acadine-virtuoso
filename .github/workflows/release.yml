name: Prepare draft release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Require main
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject any other ref
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = "refs/heads/main"

  required-ci:
    name: Required CI
    needs: guard
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build verified assets
    needs: required-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare fixed build directories
        run: |
          set -euo pipefail
          test ! -L dist
          test ! -L build
          test ! -L plugins/obsidian/main.js
          rm -rf dist build
          rm -f plugins/obsidian/main.js
          mkdir -p dist/python

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/obsidian/package-lock.json

      - name: Install pinned uv and locked project
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r ci/bootstrap.txt
          uv sync --locked --group build

      - name: Validate source versions
        run: .venv/bin/python scripts/release_artifacts.py version

      # Required CI installs these exact bytes on macOS and Linux.
      - name: Download tested Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist-${{ github.sha }}
          path: dist/

      - name: Recheck transferred installations
        run: python scripts/check_distributions.py

      - name: Install plugin dependencies
        working-directory: plugins/obsidian
        run: npm ci

      - name: Type-check plugin
        working-directory: plugins/obsidian
        run: npm run typecheck

      - name: Test plugin
        working-directory: plugins/obsidian
        run: npm test

      - name: Build plugin
        working-directory: plugins/obsidian
        run: npm run build

      - name: Assemble release assets
        run: .venv/bin/python scripts/release_artifacts.py assemble

      - name: Verify release assets
        run: .venv/bin/python scripts/release_artifacts.py verify

      - name: Upload exact release directory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: virtuoso-release-${{ github.sha }}
          path: dist/release
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Create draft GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Download exact release directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: virtuoso-release-${{ github.sha }}
          path: dist/release

      - name: Reverify downloaded assets
        run: python scripts/release_artifacts.py verify

      - name: Refuse an existing tag or release
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python scripts/release_artifacts.py version)
          if git rev-parse --verify --quiet "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION already exists" >&2
            exit 1
          fi

          RELEASE_TAGS=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].tag_name')
          if printf '%s\n' "$RELEASE_TAGS" | grep -Fxq "v$VERSION"; then
            echo "Release v$VERSION already exists" >&2
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      # Repository identity and version enter the shell through environment variables.
      - name: Create draft release at this commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --draft \
            --latest=false \
            --title "v$VERSION" \
            --notes-file "docs/releases/v$VERSION.md"
