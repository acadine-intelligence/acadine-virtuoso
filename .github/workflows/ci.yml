name: CI

# Pull request code receives no secrets or writable token.
# Only GitHub-owned Actions are used. uv is bootstrapped from hash-checked wheels.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install pinned uv
        run: 'python -m pip install --only-binary=:all: --require-hashes -r ci/bootstrap.txt'

      - name: Install locked project and build dependencies
        run: uv sync --locked --group build

      - name: Compile Python
        run: uv run --locked python -m compileall -q src tests scripts

      - name: Run Python tests
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Smoke-test development CLI
        run: uv run --locked virtuoso --help

      - name: Build distributions with locked build dependencies
        run: |
          uv sync --locked --group build
          uv build --no-build-isolation --out-dir dist/python
          uv export --locked --no-emit-project --group build --format requirements-txt --output-file dist/install-requirements.txt

      - name: Reject a wheel with a missing package resource
        run: uv run --locked python -m unittest discover -s tests/integration -v

      - name: Upload installation candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  install:
    name: Install (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.11.15', '3.12', '3.13', '3.14']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up test Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install pinned uv
        run: 'python -m pip install --only-binary=:all: --require-hashes -r ci/bootstrap.txt'

      - name: Download the exact distributions from the build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist-${{ github.sha }}
          path: dist/

      - name: Exercise wheel and source distribution outside the checkout
        run: python scripts/check_distributions.py

  obsidian-plugin:
    name: Obsidian plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/obsidian
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/obsidian/package-lock.json

      - name: Install plugin dependencies
        run: npm ci

      - name: Type-check plugin
        run: npm run typecheck

      - name: Run plugin tests
        run: npm test

      - name: Build plugin
        run: npm run build

  verified:
    # Retain the repository's required status name, with the complete matrix behind it.
    name: Python 3.11
    if: ${{ always() }}
    needs: [python, install, obsidian-plugin]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          needs = json.loads(os.environ["NEEDS_JSON"])
          results = {name: row["result"] for name, row in needs.items()}
          failures = [name for name, result in results.items() if result != "success"]
          if set(results) != {"python", "install", "obsidian-plugin"} or failures:
              raise SystemExit(f"Required checks did not pass: {results}")
          print("All required checks passed")
          PY
